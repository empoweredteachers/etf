<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Resource is Ready | Empowered Teachers Forum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
font-family:Montserrat,sans-serif;
background:#f7f9f8;
color:#1d2a26;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:30px;
}
.card{
background:#fff;
max-width:760px;
width:100%;
border-radius:20px;
padding:50px;
text-align:center;
box-shadow:0 15px 45px rgba(0,0,0,.08);
}
.icon{
font-size:70px;
margin-bottom:20px;
}
h1{
color:#0F5B4C;
margin-bottom:15px;
}
.subtitle{
font-size:18px;
line-height:1.7;
margin-bottom:35px;
}
.resource{
background:#f3f7f6;
padding:30px;
border-radius:15px;
margin:30px 0;
}
.resource img{
width:180px;
border-radius:10px;
margin-bottom:20px;
}
.resource h2{
margin-bottom:10px;
}
.resource p{
margin-bottom:25px;
line-height:1.7;
}
.btn{
display:inline-block;
padding:16px 32px;
background:#0F5B4C;
color:#fff;
text-decoration:none;
border-radius:10px;
font-weight:700;
transition:.3s;
}
.btn:hover{
background:#0b463b;
}
.btn.disabled{
background:#9aa9a4;
pointer-events:none;
}
.redirect-note{
margin-top:16px;
margin-bottom:0 !important;
font-size:13px;
color:#888;
}
.footer{
margin-top:40px;
font-size:14px;
color:#666;
}
</style>
</head>
<body>
<div class="card">
<div class="icon">🎉</div>
<h1>You're In!</h1>
<p class="subtitle" id="subtitle">
Thank you for joining the Empowered Teachers Forum.
Your free resource is ready.
</p>
<div class="resource">
<img id="resourceImage" src="/images/logo1.png" alt="Free Resource">
<h2 id="resourceTitle"></h2>
<p id="resourceDescription"></p>
<!-- No "download" attribute here: it is added by the script only for real PDF files. -->
<a id="downloadButton" class="btn" href="/#resources">Download Resource</a>
<p class="redirect-note" id="redirectNote"></p>
</div>
<div class="footer">
Follow Empowered Teachers Forum for more career tips and international teaching opportunities.
</div>
</div>
<script>
// "file" is the PDF to download. A resource with no file (the community
// fallback) gets a normal link instead of a download button.
// The address of your Cloudflare Worker (the one that handles payments and
// downloads), with no trailing slash. Example: "https://etf-api.yourname.workers.dev"
const WORKER_URL = "https://YOUR-WORKER-URL";

const resources = {
  "free-checklist": {
    title: "International Teacher Readiness Checklist",
    description: "Assess whether you're ready to apply for international teaching opportunities.",
    image: "/images/ChecklistFreee.png",
    file: WORKER_URL + "/free-download?offer=free-checklist"
  },
  "free-ai-cv": {
    title: "AI CV Review Prompt",
    description: "Review your CV like an international school recruiter using AI.",
    image: "/images/aicv.png",
    file: WORKER_URL + "/free-download?offer=free-ai-cv"
  },
  "community": {
    title: "Welcome to the Community",
    description: "Explore our growing collection of free resources designed for teachers.",
    image: "/images/logo1.png",
    file: null
  }
};

const params = new URLSearchParams(window.location.search);
const offerKey = params.get("offer") || "community";
const offer = Object.prototype.hasOwnProperty.call(resources, offerKey) ? offerKey : "community";
const resource = resources[offer];

const button = document.getElementById("downloadButton");
const note = document.getElementById("redirectNote");

document.getElementById("resourceTitle").textContent = resource.title;
document.getElementById("resourceDescription").textContent = resource.description;
document.getElementById("resourceImage").src = resource.image;

if (!resource.file) {

  // Community / unknown offer: nothing to download, so never use the
  // "download" attribute (with href="#" it saves this HTML page itself).
  document.getElementById("subtitle").textContent =
    "Thank you for joining the Empowered Teachers Forum.";
  button.textContent = "Explore Free Resources";
  button.href = "/#resources";

} else {

  button.href = resource.file;
  button.setAttribute("download", "");

  // Safety net: make sure the file really is a PDF before the visitor clicks.
  // If the path is wrong the server may return a web page, which would
  // otherwise be saved with a .pdf name.
  fetch(resource.file, { method: "HEAD" })
    .then((res) => {
      const type = res.headers.get("content-type") || "";
      if (!res.ok || !type.includes("pdf")) {
        console.error("Resource is not a PDF:", resource.file, res.status, type);
        button.removeAttribute("download");
        button.classList.add("disabled");
        button.removeAttribute("href");
        note.textContent = "This resource is temporarily unavailable. Please contact us and we'll send it to you.";
      }
    })
    .catch(() => { /* network hiccup: leave the button working */ });

  // After the download starts, send the visitor back to the resources section.
  button.addEventListener("click", () => {
    note.textContent = "Taking you back to more resources...";
    setTimeout(() => {
      window.location.href = "/#resources";
    }, 1200);
  });
}
</script>
</body>
</html>
