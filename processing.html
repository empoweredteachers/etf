<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verifying Payment | Empowered Teachers Forum</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --green:#052f23;
    --gold:#d4af37;
    --light:#f7f9f8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Montserrat',sans-serif;
    background:var(--light);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;

}

.card{

    width:100%;
    max-width:600px;
    background:white;
    border-radius:22px;
    padding:60px 40px;
    text-align:center;
    box-shadow:0 18px 45px rgba(0,0,0,.08);

}

.logo{

    color:var(--green);
    font-weight:800;
    letter-spacing:1px;
    font-size:14px;
    margin-bottom:30px;

}

.spinner{

    width:80px;
    height:80px;
    border:8px solid #ececec;
    border-top:8px solid var(--gold);
    border-radius:50%;
    margin:auto;
    animation:spin 1s linear infinite;

}

@keyframes spin{

from{transform:rotate(0deg);}
to{transform:rotate(360deg);}

}

h1{

    margin-top:35px;
    color:var(--green);
    font-size:32px;

}

p{

    margin-top:18px;
    line-height:1.8;
    color:#666;

}

.status{

    margin-top:35px;
    color:var(--gold);
    font-weight:700;

}

footer{

    margin-top:40px;
    color:#888;
    font-size:14px;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

EMPOWERED TEACHERS FORUM

</div>

<div class="spinner"></div>

<h1>

Verifying Payment...

</h1>

<p>

Please wait while we securely confirm your payment.

This usually takes only a few seconds.

</p>

<div class="status" id="status">

Contacting payment server...

</div>

<footer>

Please don't close this page.

</footer>

</div>

<script>

async function verifyPayment(){

    const params = new URLSearchParams(window.location.search);

    const reference = params.get("reference");
console.log("Payment reference:", reference);
    if(!reference){

        window.location.href="failed.html";

        return;

    }

    document.getElementById("status").textContent="Confirming payment...";

    try{

        const response = await fetch(

            "https://rapid-hat-720.empowerteachernow.workers.dev/verify-payment",

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                const selectedProducts = JSON.parse(
    localStorage.getItem("selectedOffers") || "[]"
                    );
                    
                    body: JSON.stringify({
                        reference: reference,
                        products: selectedProducts
                    })

            }

        );

        const data = await response.json();

        console.log(data);

      if (data.success) {

    // Save the secure download token
    localStorage.setItem("downloadToken", data.token);

    // Save what the customer purchased
    localStorage.setItem(
        "purchasedProducts",
        JSON.stringify(selectedProducts)
    );

    window.location.href =
        "success.html?reference=" + reference;

} else {

    window.location.href = "failed.html";

}

    }

    catch(error){

        console.error(error);

        window.location.href="failed.html";

    }

}

verifyPayment();

</script>

</body>
</html>
